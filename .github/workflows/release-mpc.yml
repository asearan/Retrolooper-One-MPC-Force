name: Draft Retrolooper One for MPC OS 3.10.1

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@0dc17120cd7e952e95eeecdd820ac9e495a75ee9
    with:
      tag: mpc-v0.4.0
      version: 0.4.0
      tools_ref: 0dc17120cd7e952e95eeecdd820ac9e495a75ee9
      vst_dir: ports/akai
      plugin_id: retrolooper-one
      license: GPL-3.0-only
      zig: "0.13.0"
      user_data: Loops Exports
      about: "Stereo Audio looper for MPC OS 3.10.1. Copy the folder into VST2 Plugins on any drive. Loops and exports stay beside the plugin. RlO1 is unchanged."
      requires: "MPC OS 3.10.1 External Plugin Support. Gen1 uses the armv7 zip, Gen2 the aarch64 zip, or the SDK zip for both."
      extra: "ports/akai/vendor/mpc-vst-plugins-LICENSE:licenses/mpc-vst-plugins-LICENSE third_party/signalsmith-stretch/LICENSE.txt:licenses/signalsmith-stretch-LICENSE.txt third_party/signalsmith-linear/LICENSE.txt:licenses/signalsmith-linear-LICENSE.txt ports/akai/README.md:RETROLOOPER.md"
      build: |
        python3 ports/akai/build.py arm --zig zig --kit "$MPC_VST"
        python3 ports/akai/build.py skin --kit "$MPC_VST"
